name: SupportDemo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET SDK 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/SupportDemo.Tests/SupportDemo.Tests.csproj

      - name: Build Release
        run: dotnet build tests/SupportDemo.Tests/SupportDemo.Tests.csproj -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/SupportDemo.Tests/SupportDemo.Tests.csproj -c Release --no-build --no-restore

      - name: Publish API
        run: dotnet publish SupportDemo.csproj -c Release --no-restore -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: support-demo-release
          path: ./publish
          if-no-files-found: error