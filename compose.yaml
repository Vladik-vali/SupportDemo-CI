services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=supportdb;Username=supportuser;Password=supportpass
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=supportdb
      - POSTGRES_USER=supportuser
      - POSTGRES_PASSWORD=supportpass
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: